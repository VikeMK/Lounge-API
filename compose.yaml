name: lounge-api

x-db-conn: &db-conn "Server=db,1433;Database=Lounge;User Id=sa;Password=${SA_PASSWORD:?set SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"   # so you can connect from SSMS / Azure Data Studio on Windows
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # Healthy only once every database is ONLINE. SQL Server accepts logins before it has finished opening
      # existing databases; if migrate connects in that window, EF thinks Lounge doesn't exist and tries to create it.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"IF EXISTS (SELECT 1 FROM sys.databases WHERE state_desc <> 'ONLINE') RAISERROR('databases still starting', 16, 1)\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Local S3 emulator standing in for Cloudflare R2 (table images). Development only.
  # Creates the bucket on startup, accepts any credentials and serves objects publicly at
  # http://localhost:9090/lounge-table-images/<id>.png, like the public R2 domain in production.
  s3mock:
    image: adobe/s3mock:5.2.3
    profiles: ["development"]
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: lounge-table-images
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot   # must be this path for a named volume (see S3Mock README)
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3mock-data:/s3mockroot

  migrate:
    build:
      context: .
      target: migrator
    environment:
      ConnectionStrings__DefaultConnection: *db-conn
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: *db-conn
      # Table image bucket. Defaults point at the local s3mock; production sets the R2_* values in .env.
      # S3Endpoint is where the app uploads (inside Docker); PublicBaseUrl is where browsers get redirected.
      TableImages__S3Endpoint: ${R2_ENDPOINT:-http://s3mock:9090}
      TableImages__Region: auto
      TableImages__AccessKeyId: ${R2_ACCESS_KEY_ID:-dev}
      TableImages__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-dev}
      TableImages__Bucket: ${R2_BUCKET:-lounge-table-images}
      TableImages__PublicBaseUrl: ${TABLE_IMAGE_BASE_URL:-http://localhost:9090/lounge-table-images}
      # Cloudflare cache purge for re-uploaded images. Empty locally (purging is then skipped).
      Cloudflare__ZoneId: ${CLOUDFLARE_ZONE_ID:-}
      Cloudflare__PurgeToken: ${CLOUDFLARE_PURGE_TOKEN:-}
      APICredentials__Username: ${API_USERNAME:-admin}
      APICredentials__Password: ${API_PASSWORD:-admin}
      APICredentials__PasswordSecondary: ${API_PASSWORD_SECONDARY:-admin2}
    ports:
      - "5000:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3mock:
        condition: service_started
        required: false   # s3mock only exists in the development profile
    restart: unless-stopped

  # Web SQL client at http://localhost:8978. Only runs when COMPOSE_PROFILES includes "development" (see .env)
  dbui:
    image: dbeaver/cloudbeaver:latest
    profiles: ["development"]
    ports:
      - "127.0.0.1:8978:8978"   # localhost only, never expose this publicly
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql-data:
  s3mock-data:
  cloudbeaver-data:
